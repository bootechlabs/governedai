name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: governedai
          POSTGRES_PASSWORD: governedai
          POSTGRES_DB: governedai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://governedai:governedai@localhost:5432/governedai
      # Placeholder values, not real credentials — nothing in CI actually
      # calls the Stytch API, but the client throws at module load if
      # these env vars are unset (see src/lib/stytch.ts).
      STYTCH_PROJECT_ID: project-test-ci-placeholder
      STYTCH_SECRET: secret-test-ci-placeholder
      NEXT_PUBLIC_STYTCH_PUBLIC_KEY: public-token-test-ci-placeholder
      STYTCH_PROJECT_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Unit tests import src/lib/prisma.ts, which needs the generated
      # client on disk — not just its types, the actual PrismaClient
      # value import. The build step regenerates it again for the migrate
      # + next build sequence, so this only needs to run once up front.
      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

      # Same script Vercel runs — applies migrations against the service
      # Postgres above, then builds. Keeps CI and production on one
      # source of truth for "what does a build actually do."
      - name: Build (migrate + next build)
        run: pnpm run build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm run test:e2e
